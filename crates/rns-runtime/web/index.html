<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>rsReticulum</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <span class="brand-mark">R</span>
      <div>
        <span class="eyebrow">Web configurator</span>
        <h1>rsReticulum</h1>
      </div>
    </header>

    <section class="panel" aria-live="polite">
      <div class="status">
        <span class="status-dot"></span>
        <strong id="status-label">Connecting to rnsd-rs…</strong>
      </div>
      <p id="status-detail">
        The embedded Web UI is available. Dashboard and configuration tools
        will be added in the next implementation block.
      </p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
