[package]
name = "rns-runtime"
description = "Core runtime, config parsing, and lifecycle for Reticulum"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["full"]
# Application runtime that can only attach to an already-running shared
# Reticulum instance. It never owns hardware interfaces or starts a shared
# server itself.
client = ["rns-interface/shared-client"]
# Preserve the pre-feature-split API and behaviour for existing dependants.
full = ["client", "rns-interface/full"]
serial = ["full", "rns-interface/serial"]
rnode-tcp = ["full", "rns-interface/rnode-tcp"]
ble = ["full", "rns-interface/ble"]
api = ["full", "dep:axum", "dep:tower-http", "dep:rand", "dep:tracing-subscriber", "dep:tokio-stream"]

[dependencies]
rns-crypto = { workspace = true, features = ["std"] }
rns-wire = { workspace = true, features = ["std"] }
rns-identity = { workspace = true }
rns-transport = { workspace = true }
rns-link = { workspace = true }
rns-protocol = { workspace = true }
rns-interface = { workspace = true, default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
nix = { workspace = true }

# Optional REST API (feature = "api")
axum = { version = "0.8", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
rand = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
