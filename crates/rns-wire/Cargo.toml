[package]
name = "rns-wire"
description = "Wire format, packet encoding, and hash computation for Reticulum"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
memory-profile = ["std", "dep:allocative"]
default = ["std"]
std = ["rns-crypto/std"]

[dependencies]
allocative = { version = "0.3.6", optional = true }
rns-crypto = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
