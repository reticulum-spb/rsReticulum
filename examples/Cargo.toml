[package]
name = "rns-examples"
description = "Rust counterparts and API coverage tests for Reticulum/Examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["reticulum-full"]
reticulum-full = ["rns-runtime/full"]
reticulum-client = ["rns-runtime/client"]

[dependencies]
clap = { workspace = true }
rns-crypto = { workspace = true, features = ["std"] }
rns-wire = { workspace = true, features = ["std"] }
rns-identity = { workspace = true }
rns-link = { workspace = true }
rns-protocol = { workspace = true }
rns-runtime = { workspace = true }
hex = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
